plugins { id 'com.android.application' version '9.0.0' }
layout.buildDirectory = file(providers.gradleProperty('agentBuildDir').getOrElse('build'))

android {
    namespace 'com.byeolmuri.petai.alarmtest'
    compileSdk 36
    defaultConfig {
        applicationId 'com.byeolmuri.petai.alarmtest'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main {
        java.srcDirs = ['src', '../../../Platform/src']
        manifest.srcFile 'AndroidManifest.xml'
        jniLibs.srcDirs = [providers.gradleProperty('agentNativeDir').get()]
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = false } }
}
dependencies { implementation 'com.google.android.gms:play-services-fitness:21.2.0' }
