name: Repository privacy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test privacy checker
        run: python3 -m unittest discover -s scripts/tests -p 'test_*privacy*.py'
      - name: Inspect new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check_repository_privacy.py --base "$BASE"
