[project]
name = "petai-guardrail"
version = "0.1.0"
description = "Reproducible guardrail baseline harness for PetAI's LiteRT-LM deployment model"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "huggingface-hub==0.36.0",
    "jsonschema==4.25.1",
]

[project.optional-dependencies]
judge = [
    "safetensors==0.6.2",
    "torch==2.9.0",
    "transformers==4.57.6",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[project.scripts]
guardrail = "petai_guardrail.cli:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["petai_guardrail"]
