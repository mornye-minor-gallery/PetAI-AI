[project]
name = "petai-facetroutebench"
version = "0.3.0"
description = "Reproducible FacetRouteBench authoring and routing evaluation harness"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-edge-litert==2.1.3",
    "jsonschema>=4.23,<5",
    "numpy>=2.0,<3",
    "sentencepiece==0.2.1",
]

[project.scripts]
frbench = "facetroutebench.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["facetroutebench"]
