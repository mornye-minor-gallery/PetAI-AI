[project]
name = "beolmuri-eval"
version = "0.1.0"
description = "Shared Swift persona evaluation with LiteRT-LM and a Codex CLI judge"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23,<5",
    "PyYAML>=6.0.2,<7",
    "referencing>=0.35,<1",
]

[project.optional-dependencies]
retrieval = ["numpy>=2,<3", "sentencepiece==0.2.1", "ai-edge-litert==2.1.3"]

[project.scripts]
beolmuri-eval = "beolmuri_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beolmuri_eval"]
